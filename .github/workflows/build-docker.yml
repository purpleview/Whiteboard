# This workflow will do clean build of the docker image

name: Build and publish Whiteboard

on:
  push:
    # Publish `master` as Docker `latest` image.
    branches:
      - master
    paths:
      - "**"
    # Publish `v1.2.3` tags as releases.
    tags:
      - v*

  # Run tests for any PRs.
  pull_request:

env:
  IMAGE_NAME: purpleview-whiteboard

jobs:
  test:
    # Genau die Tests aus tests.yml - keine zweite Definition, die
    # auseinanderlaufen koennte. Schlagen sie fehl, wird kein Image gebaut.
    # Der Badge-Commit dort greift nur auf master und bleibt beim Aufruf
    # fuer einen Tag aus; die Berechtigung muss trotzdem gewaehrt werden,
    # weil GitHub die Deklaration des aufgerufenen Workflows prueft und
    # den Lauf sonst gar nicht startet.
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: write

  push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write          # release and release assets
      packages: write          # push to ghcr.io
      id-token: write          # SBOM attestation
      attestations: write
      artifact-metadata: write
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Build image
        run: |
          IMAGE_ID=ghcr.io/purpleview/whiteboard/$IMAGE_NAME
          VERSION=$(echo ${{ github.ref_name }} | sed -e 's/^v//')
          # Use Docker `latest` tag convention
          [ "$VERSION" == "master" ] && VERSION=latest
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV
          docker build . --build-arg DOCKER_TAG=$VERSION --tag image

      - name: Log into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          docker tag image $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION

      # Releases nur fuer Versions-Tags. Ein Push auf master lief frueher ebenfalls
      # hier durch und legte ein Release samt Tag "master" an - der Branch war
      # danach als Refspec mehrdeutig ("dst refspec master matches more than one").
      - name: Create Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }} (Revision ${{ github.run_number }})
          draft: false
          prerelease: false

      - name: Get release
        if: startsWith(github.ref, 'refs/tags/v')
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # SBOM according to BSI TR-03183-2 (CycloneDX 1.6), see purpleview/sbom-action.
      # The Whiteboard is a fork of cracker0dks/whiteboard and stays under the MIT licence.
      - name: Generate SBOM (CycloneDX JSON) from Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: purpleview/sbom-action@v1
        with:
          mode: image
          image: ${{ env.IMAGE_ID }}:${{ env.VERSION }}
          output: cyclonedx-bom-${{ env.VERSION }}.json
          own-license: MIT
          own-packages: ^whiteboard$
          own-files: |
            /opt/app/scripts/**/*.js
            /opt/app/dist/**/*.js
            !/opt/app/**/*.test.js

      - name: Upload SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "cyclonedx-bom-${{ env.VERSION }}.json" --clobber -R "${{ github.repository }}"

      - name: Save tag name to env
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TAG=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
