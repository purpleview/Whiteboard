name: Tests

# Laeuft bei jedem Push auf einen Branch und bei jedem Pull Request und
# ist per workflow_call aus build-docker.yml aufrufbar. Ersetzt den frueheren
# Workflow "Linting and testing code CI".
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: write # fuer den Badge-Commit und den Coverage-Stempel auf master

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest-Tests mit Coverage
    runs-on: ubuntu-latest

    env:
      # Secrets sind in step.if nicht verfuegbar, ueber env schon (maskiert).
      DEVELOPMENT_READ_TOKEN: ${{ secrets.DEVELOPMENT_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Der Coverage-Stempel braucht die Git-Historie fuer git blame. Ein
          # flacher Klon schriebe sonst jede Zeile dem Checkout-Commit zu.
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "18" # wie im Dockerfile
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Code-Style (prettier)
        run: npm run style

      # jest.config.js schaltet Coverage ein und schreibt coverage/ mit
      # cobertura-coverage.xml (Stempel) und coverage-summary.json (Badge).
      - name: Tests mit Coverage
        run: npm test

      - name: Coverage-Report
        id: coverage
        run: |
          percent=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct.toFixed(1))")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage: ${percent} % (Zeilen)"
            echo
            echo '```'
            node -e "const t=require('./coverage/coverage-summary.json').total; for (const k of ['lines','statements','branches','functions']) console.log(k.padEnd(11), t[k].covered+'/'+t[k].total, t[k].pct+' %')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage-Report als Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/coverage-summary.json
          retention-days: 14

      # Badge nur auf master fortschreiben. Bei Pull Requests und
      # Feature-Branches waere ein Commit unerwuenscht, beim Aufruf aus
      # build-docker.yml zeigt github.ref auf den Tag - beides faellt hier raus.
      - name: Coverage-Badge in der README aktualisieren
        id: badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: python3 .github/scripts/update_badge.py coverage --percent ${{ steps.coverage.outputs.percent }}

      - name: Badge committen
        if: steps.badge.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: Coverage-Badge auf ${{ steps.coverage.outputs.percent }} % aktualisieren [skip ci]'
          # Zwischenzeitliche Pushes auf master nicht ueberschreiben
          git pull --rebase origin master
          git push origin HEAD:master

      # ------------------------------------------------------------------
      # Coverage-Stempel fuer den Monatsbericht: fuer jede abdeckbare Zeile
      # der Monat ihrer letzten Aenderung. Das Skript dahinter liegt einmal
      # im Repository development; metrics/ dort sammelt die Stempel ein und
      # macht daraus den Monatsbericht. Hintergrund:
      # doc/sonarqube-analyse-im-eigenen-netz.md im Repository Empathy.
      #
      # Dieses Repository ist oeffentlich, und GitHub laesst oeffentliche
      # Repositories keine Actions aus einem privaten Repository verwenden
      # ("Unable to resolve action purpleview/development"). Deshalb wird
      # development hier mit einem Token ausgecheckt und die Action lokal
      # aufgerufen. Das Token liegt im Secret DEVELOPMENT_READ_TOKEN
      # (fein granulierter PAT, Lesezugriff auf Contents von development);
      # fehlt es, werden die Stempel-Schritte uebersprungen und der Lauf
      # bleibt gruen.
      #
      # Nur auf master, und nur nach gruenen Tests: der Testschritt bricht den
      # Job sonst vorher ab. Eine rote Suite misst weniger Code und wuerde
      # die Kurve nach unten verfaelschen.
      # ------------------------------------------------------------------
      - name: Repository development auschecken (Coverage-Werkzeuge)
        id: development
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.DEVELOPMENT_READ_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: purpleview/development
          token: ${{ secrets.DEVELOPMENT_READ_TOKEN }}
          path: .development

      - name: Coverage-Stempel erzeugen
        id: coverage_stamp
        if: steps.development.outcome == 'success'
        uses: ./.development/.github/actions/coverage-stamp
        with:
          report-path: coverage/cobertura-coverage.xml

      - name: Stempel in den metrics-Branch schreiben
        if: steps.development.outcome == 'success'
        uses: ./.development/.github/actions/publish-coverage-stamp
        with:
          stamp: ${{ steps.coverage_stamp.outputs.stamp }}
          stamp-line: ${{ steps.coverage_stamp.outputs.stamp-line }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hinweis, wenn kein Stempel geschrieben wurde
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.development.outcome != 'success'
        run: echo '::warning::Kein Coverage-Stempel - Secret DEVELOPMENT_READ_TOKEN fehlt (siehe Kommentar in tests.yml).'
